name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra aer --extra plot --extra panel --extra dev
      - name: Ruff
        run: uv run ruff check .
      - name: Tests and branch coverage
        run: >-
          uv run pytest --cov=src/qiskit_qkd --cov=panel/api --cov-branch
          --cov-report=term-missing --cov-fail-under=85

  frontend:
    name: Frontend gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: panel/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Chromium end-to-end
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: panel/web/package-lock.json
      - name: Install locked API dependencies
        run: uv sync --locked --extra aer --extra panel --extra dev
      - name: Install frontend dependencies
        working-directory: panel/web
        run: npm ci
      - name: Build panel assets
        working-directory: panel/web
        run: npm run build
      - name: Install Chromium
        working-directory: panel/web
        run: npx playwright install --with-deps chromium
      - name: Run browser journeys
        working-directory: panel/web
        env:
          QKD_E2E_PYTHON: .venv/bin/python
        run: npm run test:e2e

  panel-smoke:
    name: Checkout-only panel smoke (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked panel dependencies
        run: uv sync --locked --extra panel --extra dev
      - name: Panel API smoke
        run: uv run python scripts/smoke_panel.py

  wheel:
    name: Wheel and sdist smoke
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked build tools
        run: uv sync --locked --extra dev
      - name: Build artifacts
        run: uv run python -m build --sdist --wheel
      - name: Install wheel in a clean temporary environment
        run: uv run python scripts/smoke_wheel.py

  api-contract:
    name: OpenAPI and TypeScript contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: panel/web/package-lock.json
      - name: Install locked dependencies
        run: uv sync --locked --extra panel --extra dev
      - name: Install frontend dependencies
        working-directory: panel/web
        run: npm ci
      - name: Require generated API types to be up to date
        run: uv run python scripts/check_openapi_types.py
